# Copy this file to config/antiddos.conf and adjust values.

# Network interface to monitor
INTERFACE=eth0

# Polling interval (seconds)
POLL_INTERVAL=2

# Trigger detection if received bytes between polls exceed this threshold
RX_THRESHOLD_BYTES=20000000

# Trigger detection if the top source exceeds this number of established connections
CONNECTION_THRESHOLD=250

# Comma-separated destination service ports used for connection profiling
MONITORED_PORTS=80,443

# Comma-separated IPv4 list that should never be blocked
WHITELISTED_IPS=127.0.0.1

# State directory for counters, detections, and blocks
STATE_DIR=/var/lib/antiddos

# Optional default simulation log file path
SIMULATE_LOG=
